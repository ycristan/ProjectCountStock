name: Database security tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/http/**'
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - '*sentry*'
      - 'instrumentation*'
      - 'next.config.ts'
      - 'package*.json'
      - '.github/workflows/database-security-tests.yml'
  workflow_dispatch:

concurrency:
  group: database-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  database-security:
    name: Apply migrations and verify authorization
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize disposable local Supabase project
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start disposable Supabase
        run: supabase start

      - name: Verify migration preserves existing closed counts (disposable database only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          test "$GITHUB_ACTIONS" = "true"
          supabase db reset --help
          supabase migration up --help
          supabase db reset --local --version 20260914142358 --no-seed
          psql -v ON_ERROR_STOP=1 -f supabase/tests/migrations/warehouse-before.sql
          supabase migration up --local
          psql -v ON_ERROR_STOP=1 -f supabase/tests/migrations/warehouse-after.sql

      - name: Run database authorization tests
        run: |
          supabase test db --help
          supabase test db supabase/tests/database

      - name: Lint database functions
        run: supabase db lint --level error

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify operational inventory recovery (disposable only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node tests/maintenance/warehouse-recovery.mjs

      - name: Install isolated browser test runtime
        run: |
          npm install --prefix /tmp/count-stock-browser --no-package-lock --ignore-scripts playwright@1.58.2
          node /tmp/count-stock-browser/node_modules/playwright/cli.js install --with-deps chromium

      - name: HTTP export and real SDK transport integration (disposable only)
        run: |
          supabase status --help
          npm ci --ignore-scripts
          node tests/http/inventory-export.mjs

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop

name: Codespace laboratory tests
on:
  pull_request:
    branches: [main, codex/team-flow-contracts]
    paths:
      - 'scripts/codespace-lab.mjs'
      - 'tests/lab/**'
      - '.github/workflows/codespace-lab-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codespace-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify scripts before starting services
        run: |
          node --check scripts/codespace-lab.mjs
          node --check tests/lab/codespace-lab.mjs
      - name: Prepare Chromium and existing test dependencies
        run: |
          npm ci --ignore-scripts
          npm install --prefix /tmp/count-stock-browser --no-save --ignore-scripts playwright@1.58.2
          /tmp/count-stock-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify actual laboratory launcher and team flow
        run: node tests/lab/codespace-lab.mjs

name: Inventory XLSX integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/inventory-*.ts'
      - 'tests/xlsx/**'
      - 'package*.json'
      - '.github/workflows/inventory-xlsx-tests.yml'
  workflow_dispatch:
concurrency:
  group: inventory-xlsx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  xlsx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run real XLSX roundtrip and rejection tests
        run: node --experimental-vm-modules --test --test-reporter=tap tests/xlsx/*.test.mjs
